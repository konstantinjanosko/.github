<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #faf8f5;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="sr-only" id="ticket" aria-hidden="true"></div>
  <p class="sr-only" id="live" aria-hidden="true"></p>
  <script type="module" src="route.mjs"></script>
</body>
</html>
