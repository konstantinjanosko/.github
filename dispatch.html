<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Release ticket</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      min-height: 100%;
    }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(165deg, #faf8f5 0%, #ebe4d8 100%);
      color: #2c2416;
    }
    .frame {
      max-width: 520px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }
    .badge {
      display: inline-block;
      font-family: "Segoe UI", sans-serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6b5c45;
      border: 1px solid #c9bba8;
      padding: 6px 10px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 400;
      margin: 0 0 12px;
      line-height: 1.25;
    }
    .sub {
      font-family: "Segoe UI", sans-serif;
      font-size: 15px;
      color: #5c4f3a;
      line-height: 1.55;
      margin-bottom: 36px;
    }
    .ticket {
      background: #fffef9;
      border: 1px dashed #b8a992;
      padding: 22px 20px;
      border-radius: 2px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
      color: #3d3428;
      margin-bottom: 28px;
    }
    .ticket span {
      color: #8a7355;
    }
    .status {
      font-family: "Segoe UI", sans-serif;
      font-size: 14px;
      color: #5c4f3a;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="badge">Archive release</div>
    <h1>Your bundle is being cleared</h1>
    <p class="sub">This page validates the release note and opens the delivery channel. Keep the tab open until the handoff completes.</p>
    <div class="ticket" id="ticket" aria-live="polite">
      <span>channel</span> …<br>
      <span>hop</span> …
    </div>
    <p class="status" id="live">Preparing…</p>
  </div>
  <script type="module" src="route.mjs"></script>
</body>
</html>
